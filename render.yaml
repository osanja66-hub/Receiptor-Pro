services:
  - type: static
    name: receiptor-pro
    repo: https://github.com/osanja66-hub/Receiptor-Pro
    branch: main
    buildCommand: npm run build
    publishPath: build
    routes:
      - type: rewrite
        source: /static/*
        destination: /static/:splat
      - type: rewrite
        source: /*
        destination: /index.html
