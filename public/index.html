<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Make asset URLs work correctly when the app is served from a subpath.
      During build, %PUBLIC_URL% will be replaced. If you build with
      PUBLIC_URL=. the base becomes relative ("./") which lets the browser
      load JS/CSS from the same folder no matter the path (/form/binance etc).
    -->
    <base href="%PUBLIC_URL%/">

    <title>Receiptor Pro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Leave script tags out — Create React App injects the compiled scripts during build.
      After you change this file, rebuild the app so the correct hashed script names are injected.
    -->
  </body>
</html>
